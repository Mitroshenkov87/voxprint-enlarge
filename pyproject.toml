[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "voxprint-engine"
version = "1.1.0"
description = "Shared ONNX image-upscale engine for the Voxprint suite. Clarity depends on this distribution."
requires-python = ">=3.14,<3.15"
readme = "docs/ENGINE.md"
license = "Apache-2.0"
dependencies = [
    "Pillow>=12.3.0,<13",
    "numpy>=2,<3",
    "onnxruntime>=1.20,<2",
    "imagecodecs==2026.10.10",
    "psutil>=5.9,<8",
]

[tool.setuptools.packages.find]
include = ["voxprint_engine*"]

[tool.setuptools.package-data]
"voxprint_engine.registry" = ["catalog.json"]
voxprint_engine = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short"

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["enlarge", "voxprint_engine", "main.py", "tools", "tests"]

[tool.ruff.lint]
select = ["F", "E9", "D1"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"tools/**" = ["D"]

[tool.mypy]
python_version = "3.14"
files = ["enlarge", "voxprint_engine", "main.py", "tools/audit.py", "tools/make_icon.py", "tools/render_mark.py", "tools/export_onnx.py", "tools/benchmark_gpu.py"]
ignore_missing_imports = true
follow_imports = "silent"
namespace_packages = true
explicit_package_bases = true
show_error_codes = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = false
disallow_untyped_defs = false
pretty = false
exclude = ["tests/", "third_party/"]
