# Free GitHub-hosted runners only. No GPU. The bundle has no model weights.
# Linux is a tarball of a relocatable CPython plus the app, so --install-gpu can
# write CUDA wheels on the target. An AppImage is read-only and is not used.
# A pull request labeled build-installers, or a push to build/*, uploads the
# same artifacts. Only a v* tag publishes a release.
name: release
on:
  push:
    tags: ["v*"]
    branches: ["build/*"]
  workflow_dispatch:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  linux:
    if: github.event_name != 'pull_request' || github.event.label.name == 'build-installers'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Assemble the Linux tree
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m tools.assemble_bundle --dest dist/voxprint-enlarge --platform linux --with-python
      - name: Pack the tarball
        run: tar -C dist -czf dist/voxprint-enlarge-linux-x64.tar.gz voxprint-enlarge
      - uses: actions/upload-artifact@v4
        with:
          name: enlarge-linux
          path: dist/voxprint-enlarge-linux-x64.tar.gz
          if-no-files-found: error

  windows:
    if: github.event_name != 'pull_request' || github.event.label.name == 'build-installers'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Assemble the Windows tree
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m tools.assemble_bundle --dest dist/payload --platform windows --with-python
      - name: Build the launchers
        run: |
          dotnet publish tools/launcher/VoxprintEnlarge.csproj -c Release -o dist/launcher-gui
          dotnet publish tools/launcher/voxprint-enlarge-cli.csproj -c Release -o dist/launcher-cli
      - name: Copy the launchers into the payload
        run: |
          Copy-Item dist/launcher-gui/voxprint-enlarge.exe dist/payload/voxprint-enlarge.exe
          Copy-Item dist/launcher-cli/voxprint-enlarge-cli.exe dist/payload/voxprint-enlarge-cli.exe
      # 7.1.0's installer sat on an invisible prompt on windows-latest
      # (/DIR without /SP- and /ALLUSERS). 6.7.3 is the compiler enlarge.iss needs.
      - name: Install Inno Setup
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ProgressPreference = "SilentlyContinue"
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
          $exe = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          $log = Join-Path $env:RUNNER_TEMP "inno-install.log"
          curl.exe -fL --retry 5 --retry-all-errors --retry-delay 2 -o $exe $url
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup download failed" }
          $proc = Start-Process -FilePath $exe -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/ALLUSERS", "/LOG=$log"
          ) -Wait -PassThru
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($proc.ExitCode -ne 0 -or -not $iscc) {
            if (Test-Path $log) { Get-Content $log -Tail 80 }
            throw "Inno Setup install failed (exit $($proc.ExitCode))"
          }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $iscc)
          Write-Host "Using $iscc"
      - name: Compile the installer
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          & ISCC.exe "/DSource=$root\dist\payload" "/O$root\dist" "$root\installer\windows\enlarge.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: enlarge-windows
          path: dist/voxprint-enlarge-setup.exe
          if-no-files-found: error

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    # Tag pushes only. A build/* branch or a labeled pull request uploads artifacts and stops.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Checksums and pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          mv enlarge-linux/voxprint-enlarge-linux-x64.tar.gz .
          mv enlarge-windows/voxprint-enlarge-setup.exe .
          sha256sum voxprint-enlarge-setup.exe voxprint-enlarge-linux-x64.tar.gz > SHA256SUMS
          build=$(python -c "import sys; sys.path.insert(0, '${{ github.workspace }}'); from tools.build_number import build_number; number = build_number(); print('dev' if number is None else number)")
          name=$(python -c "import sys; sys.path.insert(0, '${{ github.workspace }}'); from tools.build_number import codename; print(codename())")
          tag="${GITHUB_REF_NAME}"
          title="VOXPrint AI Enlarge ${tag#v} · build ${build} \"${name}\""
          raw="https://github.com/${GITHUB_REPOSITORY}/raw/${tag}/docs/images"
          notes="$(cat <<EOF
          Offline image upscaling for the VOXPrint suite. Nothing is uploaded.

          ![The Images step of VOXPrint AI Enlarge](${raw}/enlarge-main.webp)

          Illustrated picture, RealESRGAN anime 6B at 4×:

          ![Before](${raw}/anime-before.webp) ![After, 4×](${raw}/anime-after.webp)

          Photograph, long side from 2048 to 3840:

          ![Before](${raw}/photo-before.webp) ![After, long side 3840](${raw}/photo-after.webp)

          No model weights are included. The installer fills the shared suite folder: Python 3.14, the CUDA wheels, and the default model. Check SHA256SUMS, then follow docs/TESTING-GPU.md.

          Build number is the release workflow run plus the offset in BUILD.json. Codename: ${name}.
          EOF
          )"
          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "${GITHUB_REPOSITORY}" --clobber \
              voxprint-enlarge-setup.exe \
              voxprint-enlarge-linux-x64.tar.gz \
              SHA256SUMS
            gh release edit "$tag" --repo "${GITHUB_REPOSITORY}" \
              --title "$title" --prerelease --notes "$notes"
          else
            gh release create "$tag" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "$title" \
              --prerelease \
              --notes "$notes" \
              voxprint-enlarge-setup.exe \
              voxprint-enlarge-linux-x64.tar.gz \
              SHA256SUMS
          fi
