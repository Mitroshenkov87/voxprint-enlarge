# Code audit (tools/audit.py): ruff F/E9, mypy, bandit high, pip-audit, gitleaks.
# Vulture and radon are report-only. Tests run in the same job, on Windows and Linux.
name: audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 libfontconfig1 libxcb-cursor0
      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          ver=8.30.1
          if [ "${{ runner.os }}" = "Windows" ]; then
            dest="${RUNNER_TEMP}/gitleaks-bin"
            mkdir -p "$dest"
            curl -fsSL -o "${RUNNER_TEMP}/gitleaks.zip" "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_windows_x64.zip"
            unzip -o "${RUNNER_TEMP}/gitleaks.zip" -d "$dest"
            # GITHUB_PATH applies on the next step, and PowerShell needs a Windows path.
            if command -v cygpath >/dev/null 2>&1; then
              echo "$(cygpath -w "$dest")" >> "$GITHUB_PATH"
            else
              echo "$dest" >> "$GITHUB_PATH"
            fi
            "$dest/gitleaks.exe" version
          else
            curl -fsSL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz"
            tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
            sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
            gitleaks version
          fi
      - name: Install the app and the audit tools
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
      - name: Choose the gitleaks scan
        id: leaks
        shell: bash
        run: |
          set -euo pipefail
          event="${{ github.event_name }}"
          if [ "$event" = "schedule" ] || [ "$event" = "workflow_dispatch" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "range=" >> "$GITHUB_OUTPUT"
          elif [ "$event" = "pull_request" ]; then
            echo "mode=diff" >> "$GITHUB_OUTPUT"
            echo "range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              echo "mode=full" >> "$GITHUB_OUTPUT"
              echo "range=" >> "$GITHUB_OUTPUT"
            else
              echo "mode=diff" >> "$GITHUB_OUTPUT"
              echo "range=${before}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Audit
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/audit.py --gitleaks-mode "${{ steps.leaks.outputs.mode }}" --gitleaks-range "${{ steps.leaks.outputs.range }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-report-${{ matrix.os }}
          path: audit-report.txt
          retention-days: 14
